services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-cotton_db}
      MYSQL_USER: ${MYSQL_USER:-cotton_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-me}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-root-me}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "${MYSQL_PUBLIC_PORT:-127.0.0.1:3306}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  model-service:
    build:
      context: ./services/backend/model-service-python
    restart: unless-stopped
    environment:
      COLOR_MODEL_PATH: /app/fourtime-best.pth
      COLOR_GRADE_LABELS: ${COLOR_GRADE_LABELS:-11,21,31,41,51,61,71}
      COTTON_UNET_WEIGHTS: /app/fenge_best.pth
      IMPURITY_UNET_WEIGHTS: /app/impurityarea_best.pth
    volumes:
      - type: bind
        source: ./services/backend/model-service-python/fourtime-best.pth
        target: /app/fourtime-best.pth
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./services/backend/model-service-python/fenge_best.pth
        target: /app/fenge_best.pth
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./services/backend/model-service-python/impurityarea_best.pth
        target: /app/impurityarea_best.pth
        read_only: true
        bind:
          create_host_path: false
    expose:
      - "5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=5).read()"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 60s

  backend:
    build:
      context: ./services/backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      model-service:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-cotton_db}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-cotton_user}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-change-me}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO:-update}
      JWT_SECRET: "${JWT_SECRET:?Set JWT_SECRET to a Base64 encoded HMAC key}"
      JWT_EXPIRATION: ${JWT_EXPIRATION:-604800000}
      PYTHON_SERVICE_URL: http://model-service:5000
      PYTHON_SERVICE_CONNECT_TIMEOUT_MS: ${PYTHON_SERVICE_CONNECT_TIMEOUT_MS:-5000}
      PYTHON_SERVICE_READ_TIMEOUT_MS: ${PYTHON_SERVICE_READ_TIMEOUT_MS:-180000}
      APP_UPLOAD_DIR: /app/uploads
      APP_NEWS_CRAWLER_ENABLED: ${APP_NEWS_CRAWLER_ENABLED:-true}
      APP_NEWS_CRAWLER_INITIAL_DELAY_MS: ${APP_NEWS_CRAWLER_INITIAL_DELAY_MS:-5000}
      APP_NEWS_CRAWLER_FIXED_DELAY_MS: ${APP_NEWS_CRAWLER_FIXED_DELAY_MS:-86400000}
      APP_NEWS_CRAWLER_MAX_ITEMS_PER_SOURCE: ${APP_NEWS_CRAWLER_MAX_ITEMS_PER_SOURCE:-5}
      APP_NEWS_CRAWLER_MAX_ITEMS_PER_REFRESH: ${APP_NEWS_CRAWLER_MAX_ITEMS_PER_REFRESH:-5}
      APP_NEWS_CRAWLER_MAX_ITEMS_PER_DAY: ${APP_NEWS_CRAWLER_MAX_ITEMS_PER_DAY:-5}
      APP_NEWS_CRAWLER_MAX_STORED_ITEMS: ${APP_NEWS_CRAWLER_MAX_STORED_ITEMS:-100}
      APP_NEWS_CRAWLER_MIN_STORED_ITEMS: ${APP_NEWS_CRAWLER_MIN_STORED_ITEMS:-50}
      APP_NEWS_CRAWLER_MIN_CHINESE_RATIO: ${APP_NEWS_CRAWLER_MIN_CHINESE_RATIO:-0.75}
      APP_NEWS_CRAWLER_REQUEST_TIMEOUT_MS: ${APP_NEWS_CRAWLER_REQUEST_TIMEOUT_MS:-20000}
      APP_NEWS_CRAWLER_REQUIRE_IMAGE: ${APP_NEWS_CRAWLER_REQUIRE_IMAGE:-false}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-*}
      APP_CORS_ALLOW_CREDENTIALS: ${APP_CORS_ALLOW_CREDENTIALS:-false}
    volumes:
      - backend_uploads:/app/uploads
    ports:
      - "${BACKEND_PUBLIC_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 45s


volumes:
  mysql_data:
  backend_uploads:
