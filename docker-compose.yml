services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-cotton_db}
      MYSQL_USER: ${MYSQL_USER:-cotton_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-me}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-root-me}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "${MYSQL_PUBLIC_PORT:-127.0.0.1:3306}:3306"

  model-service:
    build:
      context: ./services/backend/model-service-python
    restart: unless-stopped
    volumes:
      - type: bind
        source: ./services/backend/model-service-python/cotton-best.pth
        target: /app/cotton-best.pth
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./services/backend/model-service-python/fenge_best.pth
        target: /app/fenge_best.pth
        read_only: true
        bind:
          create_host_path: false
    expose:
      - "5000"

  backend:
    build:
      context: ./services/backend
    restart: unless-stopped
    depends_on:
      - mysql
      - model-service
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-cotton_db}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-cotton_user}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-change-me}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO:-update}
      JWT_SECRET: ${JWT_SECRET:-Y29udG9uLXJlY29nbml0aW9uLWFzc2lzdGFudC1zZWNyZXQta2V5LWZvci1wcm9kdWN0aW9uLTIwMjY=}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-604800000}
      PYTHON_SERVICE_URL: http://model-service:5000
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-*}
    volumes:
      - backend_uploads:/app/uploads
    expose:
      - "8080"

  web:
    build:
      context: ./apps/web
      args:
        VITE_API_BASE_URL: ${WEB_API_BASE_URL:-/api}
        VITE_MOCK_WHEN_API_UNAVAILABLE: ${VITE_MOCK_WHEN_API_UNAVAILABLE:-false}
        VITE_REQUEST_TIMEOUT_MS: ${VITE_REQUEST_TIMEOUT_MS:-15000}
        VITE_RECOGNITION_TIMEOUT_MS: ${VITE_RECOGNITION_TIMEOUT_MS:-30000}
        VITE_RECOGNITION_UPLOAD_FIELD_NAME: ${VITE_RECOGNITION_UPLOAD_FIELD_NAME:-file}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${WEB_PUBLIC_PORT:-80}:80"

volumes:
  mysql_data:
  backend_uploads:
