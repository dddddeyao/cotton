server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/cotton_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: ${SPRING_JPA_OPEN_IN_VIEW:false}
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: ${SPRING_JPA_SHOW_SQL:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: ${SPRING_JPA_FORMAT_SQL:true}
  servlet:
    multipart:
      max-file-size: ${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:10MB}
      max-request-size: ${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:10MB}

# JWT 配置
jwt:
  secret: ${JWT_SECRET:}
  expiration: ${JWT_EXPIRATION:604800000}  # 7 天 (毫秒)

# Flask 推理服务地址
python:
  service:
    url: ${PYTHON_SERVICE_URL:http://127.0.0.1:5000}
    connect-timeout-ms: ${PYTHON_SERVICE_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${PYTHON_SERVICE_READ_TIMEOUT_MS:180000}

app:
  upload-dir: ${APP_UPLOAD_DIR:uploads}

  recognition:
    max-image-bytes: ${APP_RECOGNITION_MAX_IMAGE_BYTES:10485760}
    max-base64-chars: ${APP_RECOGNITION_MAX_BASE64_CHARS:14000000}
    max-image-pixels: ${APP_RECOGNITION_MAX_IMAGE_PIXELS:25000000}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:*}
    allow-credentials: ${APP_CORS_ALLOW_CREDENTIALS:false}
  news:
    crawler:
      enabled: ${APP_NEWS_CRAWLER_ENABLED:false}
      initial-delay-ms: ${APP_NEWS_CRAWLER_INITIAL_DELAY_MS:60000}
      fixed-delay-ms: ${APP_NEWS_CRAWLER_FIXED_DELAY_MS:86400000}
      max-items-per-source: ${APP_NEWS_CRAWLER_MAX_ITEMS_PER_SOURCE:5}
      max-items-per-refresh: ${APP_NEWS_CRAWLER_MAX_ITEMS_PER_REFRESH:5}
      max-items-per-day: ${APP_NEWS_CRAWLER_MAX_ITEMS_PER_DAY:5}
      max-stored-items: ${APP_NEWS_CRAWLER_MAX_STORED_ITEMS:100}
      min-stored-items: ${APP_NEWS_CRAWLER_MIN_STORED_ITEMS:50}
      min-chinese-ratio: ${APP_NEWS_CRAWLER_MIN_CHINESE_RATIO:0.75}
      request-timeout-ms: ${APP_NEWS_CRAWLER_REQUEST_TIMEOUT_MS:20000}
      require-image: ${APP_NEWS_CRAWLER_REQUIRE_IMAGE:false}
      fetch-article-content: true
      download-images: true
      image-directory: news
      include-keywords:
        - 棉花
        - 原棉
        - 皮棉
        - 籽棉
        - 进口棉
        - 新疆棉
        - 疆棉
        - 郑棉
        - 美棉
        - 棉价
        - 棉市
        - 棉纱
        - 棉纺
        - 棉企
        - 纺企
        - 纺织
        - 棉农
        - 棉花检验
        - 纤维检验
        - HVI
        - 颜色级
        - 叶屑
        - cotton
        - 海关
        - 检测
        - 识别
        - 图像识别
        - 质量检测
        - 质量
        - 纤维
        - 检验
        - 分级
        - 进口
        - 出口
      reject-keywords:
        - 娱乐
        - 体育
        - 彩票
        - 游戏
        - 汽车
        - 房产
        - 招聘
